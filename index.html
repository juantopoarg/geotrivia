<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#4FB52A">
<meta name="description" content="GeoTrivia: trivia de geografía con 4 opciones, logros y colección.">
<title>GeoTrivia</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;800&family=Nunito:wght@700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#4FB52A; --bg-d1:#3E8E21; --bg-d2:#2F6C19;
  --ink:#2B2A33; --ink2:#6B6878;
  --yellow:#FFD43B; --yellow-b:#D9A800;
  --pink:#FF5FA2; --pink-b:#D63D80;
  --violet:#7C4DFF; --violet-b:#5A33CC;
  --ok:#22C55E; --ok-bg:#E3FAEA; --ok-b:#16A34A;
  --bad:#FF4D5E; --bad-bg:#FFE5E8; --bad-b:#E11D48;
  --orange:#FF7A2F; --blue:#3D7BFF;
  --f-title:"Baloo 2",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-text:"Nunito",system-ui,-apple-system,"Segoe UI",sans-serif;
  --hard:0 3px 0 rgba(0,0,0,.22);
  --edge:6px solid rgba(0,0,0,.2);
  --light:#F4F3F8; --light-b:#D9D7E3;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0}
body{
  background-color:var(--bg);
  background-image:radial-gradient(rgba(255,255,255,.14) 2px,transparent 2.6px);
  background-size:28px 28px;
  transition:background-color .4s;
  font-family:var(--f-text);font-weight:800;color:#fff;text-shadow:var(--hard);
  overflow:hidden;-webkit-font-smoothing:antialiased;
}
button{font-family:inherit;color:inherit}
#app{
  position:relative;max-width:560px;margin:0 auto;height:100vh;height:100dvh;
  padding:max(16px,env(safe-area-inset-top)) max(16px,env(safe-area-inset-right)) max(16px,env(safe-area-inset-bottom)) max(16px,env(safe-area-inset-left));
  display:flex;flex-direction:column;
}
.screen{display:none;flex:1;min-height:0;flex-direction:column;gap:10px;overflow-x:hidden;overflow-y:auto;scrollbar-width:none;animation:fadeUp .3s ease both}
.screen::-webkit-scrollbar{display:none}
.screen.on{display:flex}

/* ---------- componentes ---------- */
.card{background:#fff;color:var(--ink);border-radius:22px;border-bottom:var(--edge);padding:14px}
.card,.card *,.opt,.opt *,.chip,.score,.fb,.fb *,.tag,.btn.go,.ac,.ac *,.toast,.toast *,.cell,.cell *{text-shadow:none}
.btn{
  flex:1;min-height:54px;border:0;border-radius:18px;border-bottom:var(--edge);
  font:800 18px var(--f-title);text-transform:uppercase;letter-spacing:.03em;color:#fff;text-shadow:var(--hard);
  display:flex;align-items:center;justify-content:center;gap:8px;padding:0 18px;cursor:pointer;
  transition:transform .08s,border-bottom-width .08s,opacity .2s;
}
.btn:active{transform:translateY(4px);border-bottom-width:2px}
.btn.play{background:var(--pink);min-height:64px;font-size:28px}
.btn.go{background:var(--yellow);color:var(--ink)}
.btn.ghost{background:rgba(255,255,255,.22)}
.btn.violet{background:var(--violet)}
.btn:disabled{opacity:.45;pointer-events:none}
.ib{
  position:relative;width:44px;height:44px;flex:none;border:0;border-radius:14px;background:rgba(255,255,255,.22);
  border-bottom:4px solid rgba(0,0,0,.15);font-size:22px;line-height:1;display:grid;place-items:center;cursor:pointer;text-shadow:none;
}
.ib:active{transform:translateY(2px);border-bottom-width:2px}
.dot{position:absolute;top:-4px;right:-4px;min-width:18px;height:18px;padding:0 4px;border-radius:999px;background:var(--bad);color:#fff;font:800 11px/18px var(--f-title);text-align:center;border:2px solid #fff}
.dot[hidden]{display:none}
.langsw{display:flex;padding:3px;border-radius:999px;background:rgba(0,0,0,.22);gap:2px}
.langsw button{min-width:44px;min-height:38px;border:0;border-radius:999px;background:transparent;font:800 14px var(--f-title);letter-spacing:.04em;cursor:pointer;text-shadow:none}
.langsw button.on{background:#fff;color:var(--ink)}
.chips{display:flex;gap:8px}
.chip{
  flex:1;min-height:44px;padding:0 6px;border:0;border-radius:999px;background:var(--light);border-bottom:4px solid var(--light-b);
  font:800 17px var(--f-title);color:var(--ink);cursor:pointer;text-transform:uppercase;letter-spacing:.03em;white-space:nowrap;
}
.chip:active{transform:translateY(2px);border-bottom-width:2px}
.chip.on{background:var(--yellow);border-bottom-color:var(--yellow-b)}
.chip.lock{opacity:.6}
.row2{display:flex;gap:8px;margin-top:8px}
.chip.sm{font-size:14px;letter-spacing:.02em;padding:0 8px;min-width:0;overflow:hidden;text-overflow:ellipsis}
.chip.timeron{background:var(--violet);border-bottom-color:var(--violet-b);color:#fff}
.foot{display:flex;gap:10px;margin-top:auto;padding-top:4px;flex:none}

/* ---------- inicio ---------- */
.top{display:flex;align-items:center;gap:10px;flex:none}
.hero{flex:1;min-height:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:6px}
.globe{font-size:clamp(40px,12vw,64px);line-height:1;animation:bob 2.4s ease-in-out infinite}
.logo{margin:0;font-family:var(--f-title);font-weight:800;line-height:.92;text-transform:uppercase;font-size:clamp(54px,18vw,84px)}
.logo .a{display:block;font-size:.62em;letter-spacing:.08em}
.logo .b{display:inline-block;color:var(--yellow);transform:rotate(-3deg);text-shadow:0 5px 0 rgba(0,0,0,.28)}
.sub{margin:0;font-size:clamp(14px,4vw,18px)}
.player{display:flex;align-items:center;gap:8px;background:rgba(0,0,0,.22);border-radius:999px;padding:4px 14px 4px 6px;cursor:pointer;border:0;color:#fff;font:800 15px var(--f-title)}
.player .av{width:32px;height:32px;border-radius:50%;background:#fff;display:grid;place-items:center;font-size:19px;text-shadow:none}
.player .xp{width:64px;height:8px;border-radius:999px;background:rgba(0,0,0,.28);overflow:hidden}
.player .xp i{display:block;height:100%;background:var(--yellow);width:0}
.nextach{display:flex;align-items:center;gap:8px;background:rgba(255,255,255,.22);border-radius:999px;padding:4px 12px;font:800 13px var(--f-title);max-width:100%;border:0;color:#fff;cursor:pointer}
.nextach[hidden]{display:none}
.nextach .pb{width:56px;height:8px;border-radius:999px;background:rgba(0,0,0,.28);overflow:hidden;flex:none}
.nextach .pb i{display:block;height:100%;background:var(--yellow);width:0}
.card h3{margin:0 0 8px;font:800 18px var(--f-title)}
.hint{margin-top:8px;display:flex;justify-content:space-between;gap:8px;font:800 14px var(--f-text);color:var(--ink2)}
.topicrow{display:flex;gap:6px;margin-top:8px}
.topicrow .chip{font-size:20px;padding:0;min-width:0}
.topicrow[hidden]{display:none}

/* ---------- juego ---------- */
.progress{flex:1;display:flex;align-items:center;gap:8px;min-width:0}
.bar{flex:1;height:16px;border-radius:999px;background:rgba(0,0,0,.25);overflow:hidden}
.bar i{display:block;height:100%;width:0;background:var(--yellow);border-radius:999px;transition:width .35s}
.score{background:#fff;color:var(--ink);border-radius:999px;padding:5px 12px;font:800 16px var(--f-title);min-width:72px;text-align:center;border-bottom:3px solid rgba(0,0,0,.2)}
.score.bump{animation:pop .35s}
.qcard{padding:12px 14px;flex:none}
.qcard.in{animation:cardIn .35s cubic-bezier(.3,1.4,.5,1)}
.tbar{position:relative;height:16px;border-radius:999px;background:#ECEAF3;overflow:hidden;margin-bottom:8px}
.tbar[hidden]{display:none}
.tbar i{display:block;height:100%;width:100%;background:var(--ok);border-radius:999px;transition:width .1s linear,background-color .3s}
.tbar.mid i{background:var(--yellow)}
.tbar.low i{background:var(--bad)}
.tbar span{position:absolute;inset:0;display:grid;place-items:center;font:800 11px var(--f-title);color:var(--ink)}
.qhead{display:flex;align-items:center;gap:8px;margin-bottom:6px}
.tag{background:var(--bg);color:#fff;border-radius:999px;padding:3px 12px;font:800 12px var(--f-title);letter-spacing:.05em;text-transform:uppercase;white-space:nowrap;transition:background-color .4s}
.streak{font:800 14px var(--f-title);color:var(--orange);white-space:nowrap}
.cnt{margin-left:auto;font:800 14px var(--f-title);color:var(--ink2);white-space:nowrap}
.q{font:800 clamp(18px,5.2vw,26px)/1.15 var(--f-title);color:var(--ink)}
.q b{color:var(--bg-d1)}
.q b.no{background:var(--bad);color:#fff;padding:0 8px;border-radius:8px}
.fb{display:none;margin-top:8px;border-radius:14px;padding:8px 10px;font:700 14px/1.25 var(--f-text)}
.fb.show{display:block;animation:pop .3s}
.fb.good{background:var(--ok-bg);color:#166534;border-bottom:3px solid var(--ok-b)}
.fb.bad{background:var(--bad-bg);color:#9F1239;border-bottom:3px solid var(--bad-b)}
.fb .t{font:800 17px var(--f-title)}
.opts{flex:1;min-height:0;display:flex;flex-direction:column;gap:10px}
.opt{
  flex:1 1 0;min-height:48px;max-height:84px;display:flex;align-items:center;gap:10px;padding:0 12px;
  border:0;border-radius:18px;background:var(--light);border-bottom:6px solid var(--light-b);
  color:var(--ink);font:800 clamp(16px,4.8vw,21px)/1.05 var(--f-title);text-align:left;cursor:pointer;
  transition:transform .08s,border-bottom-width .08s,opacity .25s,background-color .2s;
}
.opt:active{transform:translateY(4px);border-bottom-width:2px}
.opt.lock{pointer-events:none}
.opt.gone{opacity:.22;filter:grayscale(1)}
.ltr{width:32px;height:32px;flex:none;border-radius:50%;background:#fff;border:3px solid var(--light-b);display:grid;place-items:center;font:800 15px var(--f-title);color:var(--ink2)}
.lab{flex:1;min-width:0}
.mk{width:30px;height:30px;flex:none;border-radius:50%;display:grid;place-items:center;font-size:17px;color:#fff;opacity:0}
.opt.good{background:var(--ok-bg);border-bottom-color:var(--ok-b)}
.opt.good .ltr{background:var(--ok);border-color:var(--ok-b);color:#fff}
.opt.good .mk{background:var(--ok);opacity:1;animation:pop .45s cubic-bezier(.3,1.6,.5,1)}
.opt.bad{background:var(--bad-bg);border-bottom-color:var(--bad-b);animation:shake .45s}
.opt.bad .ltr{background:var(--bad);border-color:var(--bad-b);color:#fff}
.opt.bad .mk{background:var(--bad);opacity:1;animation:pop .45s cubic-bezier(.3,1.6,.5,1)}
.opt.dim{opacity:.55}
.btn.joker{flex:0 0 84px;padding:0 6px;font-size:18px}

/* ---------- final ---------- */
.big{font-size:clamp(64px,20vw,96px);line-height:1;animation:bob 2s ease-in-out infinite}
.end-title{font:800 clamp(26px,8vw,38px)/1 var(--f-title);text-align:center}
.res .num{display:block;text-align:center;font:800 clamp(44px,14vw,64px)/1 var(--f-title);color:var(--ink)}
.res .lbl{display:block;text-align:center;font:800 13px var(--f-title);color:var(--ink2);letter-spacing:.08em;margin-bottom:10px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stats div{background:var(--light);border-bottom:4px solid var(--light-b);border-radius:16px;padding:8px 4px;text-align:center;font:800 20px var(--f-title);color:var(--ink)}
.stats small{display:block;font:800 11px var(--f-text);color:var(--ink2);text-transform:uppercase}
.rec{margin-top:10px;text-align:center;font:800 15px var(--f-title);color:var(--ink2)}
.rec.new{color:var(--violet)}
.gain{margin-top:8px;display:block;width:100%;min-height:44px;border:0;border-radius:999px;background:var(--yellow);border-bottom:4px solid var(--yellow-b);color:var(--ink);font:800 15px var(--f-title);cursor:pointer}

/* ---------- logros ---------- */
.lvl{display:flex;align-items:center;gap:10px;padding:10px 12px}
.lvl .av{width:48px;height:48px;border-radius:50%;background:var(--light);border-bottom:4px solid var(--light-b);display:grid;place-items:center;font-size:28px;flex:none}
.lvl .mid{flex:1;min-width:0}
.lvl .nm{font:800 17px var(--f-title);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lvl .tt{font:800 12px var(--f-text);color:var(--ink2)}
.pbar{position:relative;height:16px;border-radius:999px;background:#ECEAF3;overflow:hidden}
.pbar i{display:block;height:100%;width:0;background:var(--bg);border-radius:999px;transition:width .5s,background-color .4s}
.pbar span{position:absolute;inset:0;display:grid;place-items:center;font:800 11px var(--f-title);color:var(--ink)}
.jk{font:800 18px var(--f-title);background:var(--violet);color:#fff;border-radius:999px;padding:4px 12px;flex:none}
.tabs{display:flex;padding:4px;border-radius:999px;background:rgba(0,0,0,.2);gap:4px;flex:none}
.tab{flex:1;min-height:40px;border:0;border-radius:999px;background:transparent;font:800 14px var(--f-title);cursor:pointer;text-transform:uppercase;letter-spacing:.03em}
.tab.on{background:#fff;color:var(--ink);text-shadow:none}
.alist{flex:1;min-height:0;overflow-y:auto;display:flex;flex-direction:column;gap:10px;padding-bottom:6px;scrollbar-width:none}
.alist::-webkit-scrollbar{display:none}
.ac{background:#fff;color:var(--ink);border-radius:16px;border-bottom:var(--edge);padding:10px 12px;display:flex;gap:10px;cursor:pointer;flex:none}
.ac .ic{width:44px;height:44px;border-radius:14px;background:var(--light);border-bottom:3px solid var(--light-b);display:grid;place-items:center;font-size:24px;flex:none}
.ac .bd{flex:1;min-width:0;display:flex;flex-direction:column;gap:4px}
.ac .hd{display:flex;justify-content:space-between;gap:6px;align-items:center}
.ac .nm{font:800 17px var(--f-title)}
.ac .md{font-size:15px;letter-spacing:1px;white-space:nowrap}
.ac .ds{font:700 13px/1.2 var(--f-text);color:var(--ink2)}
.ac .rw{font:800 13px/1.25 var(--f-text);color:var(--violet)}
.ac .rw small{display:block;font:700 12px/1.2 var(--f-text);color:var(--ink2)}
.ac .more{display:none;margin-top:4px;border-top:2px dashed var(--light-b);padding-top:6px;font:700 13px/1.3 var(--f-text);color:var(--ink)}
.ac.open .more{display:block}
.ac .more div{padding:2px 0}
.ac .more .done{color:var(--ok-b)}
.sec{font:800 16px var(--f-title);margin:4px 2px 0}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(56px,1fr));gap:8px}
.cell{min-height:56px;border:0;border-radius:14px;background:var(--light);border-bottom:4px solid var(--light-b);font:800 26px var(--f-title);color:var(--ink);position:relative;cursor:pointer;display:grid;place-items:center;padding:0 4px}
.cell.on{background:var(--yellow);border-bottom-color:var(--yellow-b)}
.cell.lock{opacity:.6}
.cell .lk{position:absolute;right:3px;bottom:1px;font-size:12px}
.cell .sw{width:30px;height:30px;border-radius:50%;border:3px solid #fff;box-shadow:0 0 0 2px rgba(0,0,0,.12)}
.cell.wide{grid-column:span 2;font-size:14px;line-height:1.1}
.cell.mode{grid-column:1/-1;font-size:14px;justify-items:start;padding:8px 12px;text-align:left}

/* ---------- toasts / fx ---------- */
#toasts{position:fixed;top:max(10px,env(safe-area-inset-top));left:0;right:0;display:flex;flex-direction:column;align-items:center;gap:8px;z-index:60;pointer-events:none}
.toast{background:#fff;color:var(--ink);border-radius:18px;border-bottom:var(--edge);padding:8px 14px;max-width:min(92vw,520px);display:flex;gap:10px;align-items:center;animation:toastIn .4s cubic-bezier(.3,1.5,.5,1),toastOut .35s 2.9s forwards}
.toast .ti{font-size:30px;line-height:1}
.toast b{display:block;font:800 15px var(--f-title)}
.toast span{display:block;font:700 13px/1.2 var(--f-text);color:var(--ink2)}
#fx{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:50}
.cf{position:absolute;top:-40px;animation:fall linear forwards;text-shadow:none}
@keyframes fall{to{transform:translate(var(--dx),110vh) rotate(420deg)}}
@keyframes pop{0%{transform:scale(0)}70%{transform:scale(1.25)}100%{transform:scale(1)}}
@keyframes shake{0%,100%{transform:translateX(0)}20%{transform:translateX(-9px)}40%{transform:translateX(8px)}60%{transform:translateX(-6px)}80%{transform:translateX(4px)}}
@keyframes fadeUp{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@keyframes cardIn{from{opacity:0;transform:translateY(14px) scale(.96)}to{opacity:1;transform:none}}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
@keyframes toastIn{from{opacity:0;transform:translateY(-30px) scale(.9)}to{opacity:1;transform:none}}
@keyframes toastOut{to{opacity:0;transform:translateY(-20px)}}

/* ---------- alturas pequeñas ---------- */
@media (max-height:760px){
  .opt{min-height:50px}
}
@media (max-height:640px){
  .screen{gap:8px}
  .opts{gap:8px}
  .opt{min-height:46px;border-bottom-width:5px}
  .ltr{width:28px;height:28px;font-size:14px}
  .q{font-size:clamp(16px,4.8vw,21px)}
  .qcard{padding:10px 12px}
  .btn{min-height:48px;font-size:17px}
  .btn.play{min-height:56px;font-size:24px}
  .card{padding:10px 12px}
  .globe{display:none}
  .fb{margin-top:6px;padding:6px 10px}
  .nextach{display:none}
}
@media (max-height:600px){
  .fb .d{display:none}
  .sub{display:none}
  .hint{display:none}
  .card h3{margin-bottom:6px;font-size:16px}
  .topicrow{margin-top:6px}
  .topicrow .chip{min-height:40px}
}
@media (max-height:540px){
  .logo{font-size:clamp(44px,14vw,62px)}
  .opt{min-height:42px;font-size:15px}
  .qhead{margin-bottom:4px}
  .big{font-size:56px}
  .stats small{display:none}
}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation:none!important;transition:none!important}
}
</style>
</head>
<body>
<div id="fx" aria-hidden="true"></div>
<div id="toasts" role="status" aria-live="polite"></div>
<main id="app">

  <!-- INICIO -->
  <section id="home" class="screen on">
    <div class="top">
      <div class="langsw"><button type="button" data-lang="es">ES</button><button type="button" data-lang="en">EN</button></div>
      <span style="flex:1"></span>
      <button class="ib" id="btnAch" type="button" data-ia="achievements">🏅<span class="dot" id="achDot" hidden>0</span></button>
      <button class="ib snd" type="button" data-ia="sound">🔊</button>
    </div>
    <div class="hero">
      <div class="globe" aria-hidden="true">🌎</div>
      <h1 class="logo"><span class="a">Geo</span><span class="b">Trivia</span></h1>
      <p class="sub" data-i="tagline"></p>
      <button class="player" id="player" type="button"><span class="av" id="plAv">🌎</span><span id="plTxt"></span><span class="xp"><i id="plXp"></i></span></button>
      <button class="nextach" id="nextAch" type="button"><span id="naTxt"></span><span class="pb"><i id="naBar"></i></span></button>
    </div>
    <div class="card">
      <h3 data-i="pick_mode"></h3>
      <div class="chips" id="modes">
        <button class="chip" type="button" data-mode="10">10</button>
        <button class="chip" type="button" data-mode="20">20</button>
        <button class="chip" type="button" data-mode="50">50</button>
        <button class="chip" type="button" data-mode="inf">♾️</button>
      </div>
      <div class="row2"><button class="chip sm" id="topicBtn" type="button"></button><button class="chip sm" id="timerBtn" type="button"></button></div>
      <div class="hint"><span id="modeHint"></span><span id="modeBest"></span></div>
    </div>
    <div class="foot"><button class="btn play" id="btnPlay" type="button" data-i="play"></button></div>
  </section>

  <!-- JUEGO -->
  <section id="game" class="screen">
    <div class="top">
      <button class="ib" id="btnHome" type="button" data-ia="home">🏠</button>
      <div class="progress"><div class="bar"><i id="barFill"></i></div><span class="score" id="score">⭐ 0</span></div>
      <button class="ib snd" type="button" data-ia="sound">🔊</button>
    </div>
    <div class="card qcard" id="qcard">
      <div class="tbar" id="tbar" hidden><i id="tfill"></i><span id="tnum"></span></div>
      <div class="qhead"><span class="tag" id="tag"></span><span class="streak" id="streak"></span><span class="cnt" id="cnt"></span></div>
      <div class="q" id="qtext"></div>
      <div class="fb" id="fb" aria-live="polite"><div class="t" id="fbT"></div><div class="d" id="fbD"></div></div>
    </div>
    <div class="opts" id="opts"></div>
    <div class="foot">
      <button class="btn violet joker" id="btnJoker" type="button" data-ia="joker">✂️ 0</button>
      <button class="btn go" id="btnNext" type="button" disabled></button>
    </div>
  </section>

/* ---------- generadores ---------- */
function decoyPool(X,filterFn){
  let P=pool(X).filter(filterFn);
  if(P.length<3){const s=new Set(P);contPool(X).filter(filterFn).forEach(o=>s.add(o));P=[...s]}
  return P;
}
function gFrontYes(){
  const X=pick(D.filter(d=>d.nb&&firm(d).length>=2)),nb=firm(X);
  const inD=nb.filter(n=>byName[n]);
  const ok=(inD.length&&Math.random()<.8)?pick(inD):pick(nb);
  const P=decoyPool(X,o=>!X.nb.includes(o.n)&&!amb(X,o));
  if(P.length<3)return null;
  const ds=sample(P,3).map(o=>o.n);
  return{k:'fy:'+X.n,cr:[X.n,ok],opts:[ok,...ds],ok,
    q:()=>T2(`¿Cuál de estos países <b>limita por tierra</b> con ${the(X.n)}?`,`Which of these countries <b>shares a land border</b> with ${the(X.n)}?`),
    d:()=>T2(`${cap(the(X.n))} y ${the(ok)} comparten frontera terrestre.`,`${cap(the(X.n))} and ${the(ok)} share a land border.`)};
}
function gFrontNot(){
  const X=pick(D.filter(d=>d.nb&&firm(d).length>=3)),nb=firm(X);
  const P=decoyPool(X,o=>!X.nb.includes(o.n)&&!amb(X,o));
  if(!P.length)return null;
  const ok=pick(P.filter(o=>o.g===X.g||(X.x||[]).includes(o.g)).concat(P)).n;
  const inD=nb.filter(n=>byName[n]),rest=nb.filter(n=>!byName[n]);
  const ds=sample(inD,3);
  if(ds.length<3)ds.push(...sample(rest,3-ds.length));
  if(ds.length<3)return null;
  return{k:'fn:'+X.n,cr:[X.n,ok],opts:[ok,...ds],ok,
    q:()=>T2(`¿Cuál de estos países <b class="no">NO</b> limita por tierra con ${the(X.n)}?`,`Which of these countries does <b class="no">NOT</b> share a land border with ${the(X.n)}?`),
    d:()=>T2(`${cap(the(ok))} no tiene frontera terrestre con ${the(X.n)}. Sí comparten frontera: ${ds.map(the).join(', ')}.`,`${cap(the(ok))} has no land border with ${the(X.n)}. These do border it: ${ds.map(the).join(', ')}.`)};
}
function gPopThr(){
  const Ns=[2,3,5,8,10,15,20,30,40,50,60,80,100,150,200,300];
  for(let i=0;i<50;i++){
    const more=Math.random()<.65,N=pick(Ns),cont=pick(['AM','EU','AS','AF']);
    const P=D.filter(d=>d.p!=null&&d.c===cont);
    const good=P.filter(d=>more?(d.p>=N*1.2&&d.p<=N*5):(d.p<=N*.8&&d.p>=N/5));
    const bad=P.filter(d=>more?(d.p<=N*.8&&d.p>=N/6):(d.p>=N*1.2&&d.p<=N*6));
    if(good.length&&bad.length>=3){
      const ok=pick(good),ds=sample(bad,3),all=[ok,...ds];
      return{cr:[ok.n],opts:all.map(o=>o.n),ok:ok.n,
        q:()=>T2(`¿Cuál de estos países tiene <b>${more?'más':'menos'} de ${N} millones</b> de habitantes?`,`Which of these countries has <b>${more?'more':'fewer'} than ${N} million</b> people?`),
        d:()=>T2('Población aprox.: ','Approx. population: ')+all.map(o=>`${tr(o.n)} ${fmtP(o.p)}`).join(' · ')};
    }
  }
  return null;
}
function gPopCmp(){
  for(let i=0;i<50;i++){
    const cont=pick(['AM','EU','AS','AF']),P=D.filter(d=>d.p!=null&&d.c===cont);
    if(P.length<4)continue;
    const S4=sample(P,4).sort((a,b)=>b.p-a.p),more=Math.random()<.6;
    let ok;
    if(more){if(S4[0].p/S4[1].p<1.3)continue;ok=S4[0]}else{if(S4[2].p/S4[3].p<1.3)continue;ok=S4[3]}
    return{cr:[ok.n],opts:S4.map(o=>o.n),ok:ok.n,
      q:()=>T2(`¿Cuál de estos países tiene <b>${more?'más':'menos'} habitantes</b>?`,`Which of these countries has the <b>${more?'largest':'smallest'} population</b>?`),
      d:()=>T2('Población aprox.: ','Approx. population: ')+S4.map(o=>`${tr(o.n)} ${fmtP(o.p)}`).join(' · ')};
  }
  return null;
}
function gArea(){
  for(let i=0;i<50;i++){
    const cont=pick(['AM','EU','AS','AF']),P=D.filter(d=>d.a!=null&&d.c===cont);
    if(P.length<4)continue;
    const S4=sample(P,4).sort((a,b)=>b.a-a.a),more=Math.random()<.6;
    let ok;
    if(more){if(S4[0].a/S4[1].a<1.4)continue;ok=S4[0]}else{if(S4[2].a/S4[3].a<1.4)continue;ok=S4[3]}
    return{cr:[ok.n],opts:S4.map(o=>o.n),ok:ok.n,
      q:()=>T2(`¿Cuál de estos países tiene <b>${more?'mayor':'menor'} superficie</b>?`,`Which of these countries has the <b>${more?'largest':'smallest'} area</b>?`),
      d:()=>T2('Superficie aprox.: ','Approx. area: ')+S4.map(o=>`${tr(o.n)} ${fmtA(o.a)}`).join(' · ')};
  }
  return null;
}
function gBorn(){
  const [name,cn,place]=pick(PEOPLE),X=byName[cn];
  if(!X)return null;
  const P=decoyPool(X,()=>true);
  if(P.length<3)return null;
  const ds=sample(P,3).map(o=>o.n);
  return{k:'b:'+name,cr:[cn],opts:[cn,...ds],ok:cn,
    q:()=>T2(`¿En cuál de estos países nació <b>${tr(name)}</b>?`,`In which of these countries was <b>${tr(name)}</b> born?`),
    d:()=>T2(`${name} nació en ${place}, ${the(cn)}.`,`${tr(name)} was born in ${tr(place)}, ${tr(cn)}.`)};
}
function gCap(){
  const X=pick(D.filter(d=>d.cap&&d.cap!==d.n));
  let ds;
  if(X.cd)ds=sample(X.cd,3);
  else{
    const caps=[...new Set(decoyPool(X,o=>o.cap&&o.cap!==X.cap).map(o=>o.cap))];
    if(caps.length<3)return null;
    ds=sample(caps,3);
  }
  return{k:'c:'+X.n,cr:[X.n],opts:[X.cap,...ds],ok:X.cap,
    q:()=>T2(`¿Cuál es la capital ${ofB(X.n)}?`,`What is the capital ${ofB(X.n)}?`),
    d:()=>T2(`La capital ${ofP(X.n)} es ${X.cap}.`,`The capital ${ofP(X.n)} is ${tr(X.cap)}.`)};
}
function gCoast(){
  const not=Math.random()<.6;
  const cont=pick(not?['AM','EU','AS','AF']:['EU','AS','AF']);
  const Ld=D.filter(d=>d.ll===1&&d.c===cont),K=D.filter(d=>d.ll===0&&d.c===cont);
  if(not){
    if(!Ld.length)return null;
    const ok=pick(Ld);
    let PK=K.filter(d=>d.g===ok.g||(ok.x||[]).includes(d.g));
    if(PK.length<3)PK=K;
    if(PK.length<3)return null;
    const ds=sample(PK,3);
    return{cr:[ok.n],opts:[ok.n,...ds.map(o=>o.n)],ok:ok.n,
      q:()=>T2(`¿Cuál de estos países <b class="no">NO</b> tiene salida al mar?`,`Which of these countries has <b class="no">NO</b> coastline?`),
      d:()=>T2(`${cap(the(ok.n))} no tiene salida al mar. ${ds.map(o=>the(o.n)).join(', ')} sí tienen costa.`,`${cap(the(ok.n))} is landlocked. ${ds.map(o=>the(o.n)).join(', ')} all have a coastline.`)};
  }
  if(Ld.length<3||!K.length)return null;
  const ok=pick(K),ds=sample(Ld,3);
  return{cr:[ok.n],opts:[ok.n,...ds.map(o=>o.n)],ok:ok.n,
    q:()=>T2(`¿Cuál de estos países <b>tiene salida al mar</b>?`,`Which of these countries <b>has a coastline</b>?`),
    d:()=>T2(`${cap(the(ok.n))} tiene costa. ${ds.map(o=>the(o.n)).join(', ')} no tienen salida al mar.`,`${cap(the(ok.n))} has a coastline. ${ds.map(o=>the(o.n)).join(', ')} are landlocked.`)};
}
function gEuro(){
  const E=D.filter(d=>d.eu===1),N=D.filter(d=>NOEURO.includes(d.n));
  if(Math.random()<.5){
    const ok=pick(N),ds=sample(E,3);
    return{cr:[ok.n],opts:[ok.n,...ds.map(o=>o.n)],ok:ok.n,
      q:()=>T2(`¿Cuál de estos países <b class="no">NO</b> usa el euro como moneda?`,`Which of these countries does <b class="no">NOT</b> use the euro?`),
      d:()=>T2(`${cap(the(ok.n))} no usa el euro. ${ds.map(o=>the(o.n)).join(', ')} sí lo usan.`,`${cap(the(ok.n))} does not use the euro. ${ds.map(o=>the(o.n)).join(', ')} do.`)};
  }
  const ok=pick(E),ds=sample(N,3);
  return{cr:[ok.n],opts:[ok.n,...ds.map(o=>o.n)],ok:ok.n,
    q:()=>T2(`¿Cuál de estos países <b>usa el euro</b> como moneda?`,`Which of these countries <b>uses the euro</b>?`),
    d:()=>T2(`${cap(the(ok.n))} usa el euro (€). ${ds.map(o=>the(o.n)).join(', ')} mantienen su propia moneda.`,`${cap(the(ok.n))} uses the euro (€). ${ds.map(o=>the(o.n)).join(', ')} keep their own currency.`)};
}
const TYPES=[
  {c:'front',w:2.5,f:gFrontYes},{c:'front',w:2.5,f:gFrontNot},
  {c:'pop',w:1.5,f:gPopThr},{c:'pop',w:1,f:gPopCmp},
  {c:'born',w:3,f:gBorn},{c:'cap',w:2.5,f:gCap},
  {c:'coast',w:1.5,f:gCoast},{c:'euro',w:1,f:gEuro},{c:'area',w:1.5,f:gArea}
];
let S={seen:new Set(),lastCat:null};
function weighted(list){
  const tot=list.reduce((s,t)=>s+t.w,0);let r=Math.random()*tot;
  for(const t of list){r-=t.w;if(r<=0)return t}
  return list[0];
}
function makeQ(topic,depth=0){
  const solo=topic&&topic!=='all',list=solo?TYPES.filter(t=>t.c===topic):TYPES;
  for(let t=0;t<120;t++){
    const T=weighted(list);
    if(!solo&&T.c===S.lastCat&&Math.random()<.75)continue;
    const q=T.f();
    if(!q||new Set(q.opts).size!==4)continue;
    const key=T.c+'|'+(q.k||q.opts.slice().sort().join(','))+'|'+q.ok;
    if(S.seen.has(key))continue;
    S.seen.add(key);S.lastCat=T.c;q.cat=T.c;return q;
  }
  S.seen.clear();
  if(depth>3)throw new Error('no questions');
  return makeQ(topic,depth+1);
}

function metric(a){
  switch(a.k){
    case'games':return ST.games;case'correct':return ST.correct;case'streak':return ST.bestStreak;case'perfect':return ST.perfect;
    case'day':return ST.dayStreak;case'col':return ST.col.length;case'marathon':return ST.marathon;case'level':return lvlOf(ST.xp);
    case'tgames':return ST.tgames;case'tcorrect':return ST.tcorrect;case'tfast':return ST.tfast;case'tclutch':return ST.tclutch;case'tcold':return ST.tcold;

let snd=ls.get('geotrivia.sound','1')!=='0',AC=null;
function actx(){
  if(!AC){try{AC=new(window.AudioContext||window.webkitAudioContext)()}catch(e){}}
  if(AC&&AC.state==='suspended')AC.resume();
  return AC;
}
function tone(f,tm,d,type='triangle',v=.14){
  const a=actx();if(!a)return;
  const o=a.createOscillator(),g=a.createGain(),t0=a.currentTime+tm;
  o.type=type;o.frequency.setValueAtTime(f,t0);
  g.gain.setValueAtTime(.0001,t0);g.gain.exponentialRampToValueAtTime(v,t0+.02);g.gain.exponentialRampToValueAtTime(.0001,t0+d);
  o.connect(g);g.connect(a.destination);o.start(t0);o.stop(t0+d+.05);
}
const SFX={
  click(){tone(520,0,.07,'triangle',.1)},
  ok(){[523,659,784].forEach((f,i)=>tone(f,i*.08,.16))},
  bad(){tone(220,0,.18,'sawtooth',.09);tone(150,.12,.25,'sawtooth',.09)},
  streak(){[659,784,988,1319].forEach((f,i)=>tone(f,i*.07,.14))},
  win(){[523,659,784,1047,784,1047,1319].forEach((f,i)=>tone(f,i*.1,.22))},
  tick(){tone(880,0,.05,'square',.05)},
  ach(){[784,988,1175,1568].forEach((f,i)=>tone(f,i*.09,.2,'square',.07))}
};

let G=null;
function addXp(n){
  if(!n)return;
  const before=lvlOf(ST.xp);ST.xp+=n;const after=lvlOf(ST.xp);
  if(after>before){toast('⬆️',t('lvl_up'),t('level')+' '+after+' · '+lvlTitle(after));sfx('ach');confetti(['⭐','🎉'],14)}
}
function grant(a,i){
  const r=a.rw[i];
  if(r.jk)ST.jk+=r.jk;
  if(r.av&&!ST.avs.includes(r.av))ST.avs.push(r.av);
  if(r.th&&!ST.ths.includes(r.th))ST.ths.push(r.th);
  if(r.tt&&!ST.ttl.includes(a.id))ST.ttl.push(a.id);
  if(r.unl)ST.unl[r.unl]=true;
  addXp(r.xp);
  if(G)G.newA=(G.newA||0)+1;
  toast(a.ic,t('ach_unlocked')+' '+MED[i],achName(a)+' · '+rewardText(r));
  sfx('ach');confetti(['🏅','⭐','🎉'],18);
}
function checkAch(){
  let loop=0,changed;
  do{
    changed=false;
    ACH.forEach(a=>{
      const m=metric(a),cur=ST.ach[a.id]||0;let nt=0;
      a.th.forEach((x,i)=>{if(m>=x)nt=i+1});
      if(nt>cur){ST.ach[a.id]=nt;for(let i=cur;i<nt;i++)grant(a,i);changed=true}
    });
  }while(changed&&++loop<4);
  paintBadges();
}
const unseen=()=>ACH.reduce((s,a)=>s+Math.max(0,(ST.ach[a.id]||0)-(ST.seen[a.id]||0)),0);
function paintBadges(){
  const n=unseen(),d=$('#achDot');d.hidden=n<1;d.textContent=n;
}
function nextTarget(){
  let best=null,br=-1;
  ACH.forEach(a=>{const c=ST.ach[a.id]||0;if(c>=3)return;const r=Math.min(1,metric(a)/a.th[c]);if(r>br){br=r;best={a,c,m:metric(a),tg:a.th[c],r}}});
  return best;
}

const total=()=>G.mode==='inf'?Infinity:+G.mode;
const today=()=>{const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')};
function touchDay(){

function start(){
  G={mode:MODE,topic:TOPIC,tm:TIMER,i:0,score:0,ok:0,streak:0,maxStreak:0,lives:3,q:null,done:false,jUsed:false,xp0:ST.xp,newA:0};

function hud(){
  $('#score').textContent='⭐ '+G.score;
  $('#barFill').style.width=(G.mode==='inf'?(G.i%10)/10*100:G.i/total()*100)+'%';
  $('#cnt').textContent=G.mode==='inf'?'❤️'.repeat(G.lives)+'🖤'.repeat(3-G.lives):(Math.min(G.i+1,total()))+'/'+total();

  const j=$('#btnJoker');j.textContent='✂️ '+ST.jk;j.disabled=G.done||G.jUsed||ST.jk<1;
}
let TM=null;
function timerStop(){if(TM){clearInterval(TM.id);TM=null}}
function paintTimer(){
  if(!TM)return;
  const f=TM.left/TM.tot;
  $('#tfill').style.width=Math.max(0,f*100)+'%';
  $('#tnum').textContent=Math.ceil(TM.left/1000)+' s';
  const b=$('#tbar');b.classList.toggle('low',TM.left<=3000);b.classList.toggle('mid',TM.left>3000&&f<=.5);
}
function timerStart(sec){
  timerStop();
  const b=$('#tbar');
  if(!sec){b.hidden=true;return}
  b.hidden=false;b.classList.remove('low','mid');
  const tot=sec*1000;
  TM={tot,left:tot,last:performance.now(),sec:sec,id:setInterval(tick,100)};
  paintTimer();
}
function tick(){
  if(!TM)return;
  const now=performance.now();let dt=now-TM.last;TM.last=now;
  if(document.hidden)return;
  const before=Math.ceil(TM.left/1000);
  TM.left-=Math.min(dt,250);
  if(TM.left<=0){TM.left=0;paintTimer();timerStop();if(G&&!G.done)answer(null);return}
  const after=Math.ceil(TM.left/1000);
  if(after!==before&&after<=3)sfx('tick');
  paintTimer();
}
function nextQ(){
  if(G.i>=total()||(G.mode==='inf'&&G.lives<=0))return finish();
  const q=makeQ(G.topic);G.q=q;G.done=false;G.jUsed=false;
  setBg(CAT[q.cat].color);
  $('#tag').textContent=CAT[q.cat].tag[LANG];
  $('#qtext').innerHTML=q.q();
  $('#fb').className='fb';
  const box=$('#opts');box.innerHTML='';
  shuffle(q.opts).forEach((o,idx)=>{
    const b=document.createElement('button');
    b.type='button';b.className='opt';b.dataset.v=o;
    b.innerHTML='<span class="ltr"></span><span class="lab"></span><span class="mk"></span>';
    b.querySelector('.ltr').textContent='ABCD'[idx];
    b.querySelector('.lab').textContent=tr(o);
    b.addEventListener('click',()=>answer(b));
    box.appendChild(b);
  });
  const qc=$('#qcard');qc.classList.remove('in');void qc.offsetWidth;qc.classList.add('in');
  const nx=$('#btnNext');nx.disabled=true;nx.textContent=t('choose');
  hud();
  timerStart(G.tm);
}
function useJoker(){
  if(!G||G.done||G.jUsed)return;
  if(ST.jk<1){toast('✂️',t('joker'),t('jk_none'));sfx('bad');return}
  const wrong=$$('#opts .opt').filter(b=>b.dataset.v!==G.q.ok);
  sample(wrong,2).forEach(b=>{b.classList.add('gone','lock');b.disabled=true});
  ST.jk--;G.jUsed=true;save();sfx('click');hud();
}
function answer(btn){
  if(!G||G.done)return;
  G.done=true;
  const tmLeft=TM?TM.left:null,timeout=!btn;
  timerStop();
  const q=G.q,good=!!btn&&btn.dataset.v===q.ok;
  $$('#opts .opt').forEach(b=>{
    b.classList.add('lock');
    const isOk=b.dataset.v===q.ok;
    if(isOk){b.classList.add('good');b.querySelector('.mk').textContent='✓'}
    else if(b===btn){b.classList.add('bad');b.querySelector('.mk').textContent='✕'}
    else if(!b.classList.contains('gone'))b.classList.add('dim');
  });
  G.i++;ST.answers++;
  let fresh=null,jkWon=false,bonus=0;
  if(good){
    G.ok++;G.streak++;G.maxStreak=Math.max(G.maxStreak,G.streak);
    G.score+=100+Math.min(G.streak-1,5)*20;
    ST.correct++;ST.cat[q.cat]=(ST.cat[q.cat]||0)+1;
    ST.bestStreak=Math.max(ST.bestStreak,G.streak);
    if(G.streak%3===0){ST.jk++;jkWon=true;toast('✂️',t('streak_jk'),'');}
    if(G.mode==='inf')ST.marathon=Math.max(ST.marathon,G.ok);
    (q.cr||[]).forEach(id=>{if(byName[id]&&!ST.col.includes(id)){ST.col.push(id);fresh=fresh||id}});
    addXp(G.tm?15:10);
    if(G.tm&&tmLeft!=null){
      const el=G.tm*1000-tmLeft;bonus=Math.round(tmLeft/(G.tm*1000)*50);G.score+=bonus;
      ST.tcorrect++;if(el<=3000)ST.tfast++;if(tmLeft<1000)ST.tclutch++;
      if(G.tm===5)ST.tcold=Math.max(ST.tcold,G.streak);
    }
    sfx(G.streak>=3?'streak':'ok');
    confetti(['⭐','🎉','🌎'],G.streak>=3?26:10);
  }else{
    G.streak=0;if(G.mode==='inf')G.lives--;
    sfx('bad');
  }
  const fb=$('#fb');
  fb.className='fb show '+(good?'good':'bad');
  $('#fbT').textContent=(good?t('right'):(timeout?'⏰ '+t('timeup'):t('wrong'))+tr(q.ok))+(bonus?' · ⚡+'+bonus:'')+(jkWon?' · +1 ✂️':'')+(fresh?' · 🆕 '+flag(fresh):'');
  $('#fbD').textContent=q.d();
  const sc=$('#score');sc.classList.remove('bump');void sc.offsetWidth;if(good)sc.classList.add('bump');
  checkAch();save();
  hud();
  const last=G.i>=total()||(G.mode==='inf'&&G.lives<=0);
  const nx=$('#btnNext');nx.disabled=false;nx.textContent=last?t('result'):t('next');
}
function finish(){
  timerStop();
  const acc=G.i?Math.round(G.ok/G.i*100):0;
  const prev=bestOf(),isNew=G.score>prev&&G.score>0;
  if(isNew)ls.set(bestKey(),String(G.score));
  ST.games++;if(G.tm)ST.tgames++;
  if(G.mode!=='inf'&&total()>=10&&G.ok===G.i){ST.perfect++;addXp(50)}
  checkAch();save();
  let emoji,title,bg;
  if(acc>=80){emoji='🏆';title=t('end_a');bg='#4FB52A'}
  else if(acc>=50){emoji='👏';title=t('end_b');bg='#1AA7EC'}
  else{emoji='💪';title=t('end_c');bg='#E8645A'}
  $('#endEmoji').textContent=emoji;$('#endTitle').textContent=title;
  $('#endScore').textContent=G.score;$('#endOk').textContent=G.ok+'/'+G.i;
  $('#endStreak').textContent=G.maxStreak;$('#endAcc').textContent=acc+'%';
  const rec=$('#endRec');
  rec.textContent=isNew?t('newrec'):t('best')+Math.max(prev,0);
  rec.className='rec'+(isNew?' new':'');
  $('#endGain').textContent='+'+(ST.xp-G.xp0)+' XP'+(G.newA?' · 🏅 '+G.newA:'')+' ›';
  show('end',bg);
  sfx('win');
  if(acc>=50||isNew)confetti(['🌎','⭐','🎉','🏆','🔥','📍'],40);
  paintHome();
}

function medals(a){const c=ST.ach[a.id]||0;return[0,1,2].map(i=>i<c?MED[i]:'⚪').join('')}
function achCard(a){
  const c=ST.ach[a.id]||0,m=metric(a),done=c>=3,tg=done?a.th[2]:a.th[c],pct=done?100:Math.min(100,Math.round(m/tg*100));
  const r=a.rw[done?2:c];
  const el=document.createElement('div');el.className='ac';el.dataset.id=a.id;
  const tiers=a.th.map((x,i)=>`<div class="${i<c?'done':''}">${MED[i]} ${achDesc(a,x)} → ${rewardText(a.rw[i])}</div>`).join('');
  el.innerHTML=`<div class="ic">${a.ic}</div><div class="bd">
    <div class="hd"><span class="nm">${achName(a)}${NEWMAP[a.id]?` <span style="color:var(--bad);font-size:12px">${t('new_tag')}</span>`:''}</span><span class="md">${medals(a)}</span></div>
    <div class="ds">${achDesc(a,tg)}</div>
    <div class="pbar"><i style="width:${pct}%"></i><span>${done?t('max'):Math.min(m,tg)+' / '+tg}</span></div>
    <div class="rw">🎁 ${rewardText(r)}<small>${whyOf(r)}</small></div>
    <div class="more">${tiers}</div></div>`;
  return el;
}
function cell(txt,cls,act,v,extra){
  const b=document.createElement('button');b.type='button';b.className='cell '+(cls||'');b.dataset.act=act;b.dataset.v=v;
  b.innerHTML=txt+(extra||'');return b;
}
function renderAch(){
  const L=lvlOf(ST.xp);
  $('#lvAv').textContent=ST.av;$('#lvNm').textContent=ttlName();
  const pc=Math.round((ST.xp-lvlThr(L))/(lvlThr(L+1)-lvlThr(L))*100);
  $('#lvBar').style.width=pc+'%';$('#lvTx').textContent=t('level')+' '+L+' · '+(ST.xp-lvlThr(L))+'/'+(lvlThr(L+1)-lvlThr(L))+' XP';
  $('#lvTt').textContent='';$('#lvJk').textContent='✂️ '+ST.jk;
  $$('#tabs .tab').forEach(b=>b.classList.toggle('on',b.dataset.tab===TAB));
  const box=$('#alist');box.innerHTML='';
  if(TAB==='gen'||TAB==='cat'){
    const want=TAB==='gen'?'g':'c';
    const done=ACH.filter(a=>a.grp===want&&(ST.ach[a.id]||0)>=3).length,all=ACH.filter(a=>a.grp===want).length;
    const h=document.createElement('div');h.className='sec';h.textContent='🏅 '+done+'/'+all;box.appendChild(h);
    ACH.filter(a=>a.grp===want).forEach(a=>box.appendChild(achCard(a)));
  }else{
    const sec=(title)=>{const h=document.createElement('div');h.className='sec';h.textContent=title;box.appendChild(h);const g=document.createElement('div');g.className='grid';box.appendChild(g);return g};
    let g=sec(t('c_countries')+' '+ST.col.length+'/'+D.length);
    D.forEach(d=>{const own=ST.col.includes(d.n);g.appendChild(cell(own?flag(d.n):'❓',own?'on':'lock','co',d.n))});
    g=sec(t('c_avatars')+' '+ST.avs.length+'/'+AVATARS.length);
    AVATARS.forEach(v=>{const own=ST.avs.includes(v);g.appendChild(cell(v,own?(ST.av===v?'on':''):'lock','av',v,own?'':'<span class="lk">🔒</span>'))});
    g=sec(t('c_themes')+' '+ST.ths.length+'/'+THEMES.length);
    THEMES.forEach(x=>{const own=ST.ths.includes(x.id);g.appendChild(cell(`<span class="sw" style="background:${x.c}"></span>`,own?(ST.th===x.id?'on':''):'lock','th',x.id,own?'':'<span class="lk">🔒</span>'))});
    g=sec(t('c_titles'));
    g.appendChild(cell(t('auto'),'wide '+(ST.tt==='auto'?'on':''),'tt','auto'));
    ACH.forEach(a=>{const own=ST.ttl.includes(a.id);g.appendChild(cell(achName(a),'wide '+(own?(ST.tt===a.id?'on':''):'lock'),'tt',a.id,own?'':'<span class="lk">🔒</span>'))});
    g=sec(t('c_modes'));
    [['m50',t('mode50')],['topics',t('topics')]].forEach(([k,n])=>{const own=!!ST.unl[k];g.appendChild(cell((own?'✅ ':'🔒 ')+n,'mode '+(own?'on':'lock'),'un',k))});
  }
}
function openAch(tab){
  NEWMAP={};ACH.forEach(a=>{if((ST.ach[a.id]||0)>(ST.seen[a.id]||0))NEWMAP[a.id]=1;ST.seen[a.id]=ST.ach[a.id]||0});
  save();paintBadges();
  TAB=tab||TAB;show('ach');renderAch();$('#alist').scrollTop=0;
}
$('#alist').addEventListener('click',e=>{
  const ac=e.target.closest('.ac');if(ac){ac.classList.toggle('open');return}
  const c=e.target.closest('.cell');if(!c)return;
  const act=c.dataset.act,v=c.dataset.v;
  if(act==='co'){
    if(ST.col.includes(v))toast(flag(v),tr(v),byName[v].cap?(LANG==='en'?'Capital: ':'Capital: ')+tr(byName[v].cap):'');
    else toast('❓','???',t('collect_hint'));
    sfx('click');return;
  }
  if(act==='av'){ if(ST.avs.includes(v))ST.av=v;else{toast('🔒',v,lockMsg('av',v));sfx('bad');return} }
  if(act==='th'){ if(ST.ths.includes(v)){ST.th=v;setBg(homeBg())}else{toast('🔒',themeById(v)[LANG],lockMsg('th',v));sfx('bad');return} }
  if(act==='tt'){ if(v==='auto'||ST.ttl.includes(v))ST.tt=v;else{toast('🔒','🏷️',lockMsg('tt',v));sfx('bad');return} }
  if(act==='un'){ if(!ST.unl[v]){toast('🔒',v==='m50'?t('mode50'):t('topics'),lockMsg('unl',v));sfx('bad')}return }
  sfx('click');save();renderAch();paintHome();
});
$$('#tabs .tab').forEach(b=>b.addEventListener('click',()=>{TAB=b.dataset.tab;sfx('click');renderAch();$('#alist').scrollTop=0}));

/* ================= idioma: aplicar ================= */
function applyLang(){
  document.documentElement.lang=LANG;
  document.title='GeoTrivia';
  $$('[data-i]').forEach(el=>el.textContent=t(el.dataset.i));
  $$('[data-ia]').forEach(el=>el.setAttribute('aria-label',t(el.dataset.ia)));
  $$('.langsw button').forEach(b=>b.classList.toggle('on',b.dataset.lang===LANG));
  $('#btnHome2').textContent=t('home');$('#btnAgain').textContent=t('again');
  if(!G||!$('#game').classList.contains('on'))$('#btnNext').textContent=t('choose');
  paintHome();
  if($('#ach').classList.contains('on'))renderAch();
}
$$('.langsw button').forEach(b=>b.addEventListener('click',()=>{LANG=b.dataset.lang;ls.set('geotrivia.lang',LANG);applyLang();sfx('click')}));

/* ================= eventos ================= */
$('#btnPlay').addEventListener('click',()=>{sfx('click');start()});
$('#btnAgain').addEventListener('click',()=>{sfx('click');start()});
$('#btnNext').addEventListener('click',()=>{if(G&&G.done){sfx('click');nextQ()}});
$('#btnJoker').addEventListener('click',useJoker);
function goHome(){sfx('click');timerStop();G=null;paintHome();show('home')}
$('#btnHome').addEventListener('click',goHome);
$('#btnHome2').addEventListener('click',goHome);
$('#btnAch').addEventListener('click',()=>{sfx('click');openAch('gen')});
$('#player').addEventListener('click',()=>{sfx('click');openAch('col')});
$('#nextAch').addEventListener('click',()=>{const n=nextTarget();sfx('click');openAch(n&&n.a.grp==='c'?'cat':'gen')});
$('#endGain').addEventListener('click',()=>{sfx('click');openAch('gen')});
$('#btnBack').addEventListener('click',()=>{sfx('click');paintHome();show('home')});
document.addEventListener('keydown',e=>{
  if(!$('#game').classList.contains('on')||!G)return;
  const k=e.key.toLowerCase(),i='1234'.indexOf(k)>=0&&k.length===1?+k-1:'abcd'.indexOf(k)>=0&&k.length===1?'abcd'.indexOf(k):-1;
  if(i>=0&&!G.done){const b=$$('#opts .opt')[i];if(b&&!b.disabled)answer(b);return}
  if((e.key==='Enter'||e.key===' ')&&G.done&&document.activeElement.tagName!=='BUTTON'){e.preventDefault();nextQ()}
});
setBg(homeBg());
applyLang();
checkAch();save();
window.__geo={G:()=>G,ST:()=>ST,makeQ,D,ACH,metric};
})();
</script>
